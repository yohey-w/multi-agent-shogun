name: 'ChangelogBot'
description: 'AI-powered changelog generation without conventional commits (BYOK)'
author: 'makotonos'
branding:
  icon: 'file-text'
  color: 'purple'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key (BYOK). Either this or openai-api-key is required.'
    required: false
  openai-api-key:
    description: 'OpenAI API key (BYOK). Either this or anthropic-api-key is required.'
    required: false
  from:
    description: 'Starting ref (tag/commit). Defaults to latest tag.'
    required: false
  to:
    description: 'Ending ref (tag/commit).'
    required: false
    default: 'HEAD'
  mode:
    description: 'pr-comment | release-notes | file-commit'
    required: false
    default: 'pr-comment'
  provider:
    description: 'LLM provider: anthropic | openai. Auto-detected from API key env if omitted.'
    required: false
  model:
    description: 'LLM model name. Defaults to claude-haiku-4-5 (anthropic) or gpt-4o-mini (openai).'
    required: false
  output-file:
    description: 'File to write CHANGELOG to (used by file-commit mode).'
    required: false
    default: 'CHANGELOG.md'
  github-token:
    description: 'GitHub token for PR/Issue body fetch and PR comment / release edit / push.'
    required: false
    default: ${{ github.token }}

outputs:
  changelog:
    description: 'Generated changelog markdown section.'
  bump:
    description: 'Suggested SemVer bump (major / minor / patch).'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
    OPENAI_API_KEY: ${{ inputs.openai-api-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    CHANGELOGBOT_FROM: ${{ inputs.from }}
    CHANGELOGBOT_TO: ${{ inputs.to }}
    CHANGELOGBOT_MODE: ${{ inputs.mode }}
    CHANGELOGBOT_PROVIDER: ${{ inputs.provider }}
    CHANGELOGBOT_MODEL: ${{ inputs.model }}
    CHANGELOGBOT_OUTPUT: ${{ inputs.output-file }}
    GITHUB_REPOSITORY: ${{ github.repository }}
    GITHUB_EVENT_NAME: ${{ github.event_name }}
    GITHUB_REF: ${{ github.ref }}
    GITHUB_SHA: ${{ github.sha }}
